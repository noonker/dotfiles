# Set Ctrl-a as the prefix, and free up Ctrl-b
set -g prefix C-a
unbind C-b

# Pass Ctrl-a through to the application
bind C-a send-prefix
bind a send-prefix

# Start window numbering at 1 for easier switching
set -g base-index 1

# Colors
set -g default-terminal "screen-256color"

# Need that longer tmux display time
set -g display-panes-time 2000

# Status bar
set -g status-left "#h:[#S]"
set -g status-left-length 50
set -g status-right-length 100
setw -g window-status-current-format "|#I:#W|"

# Turn off automatic renaming of windows
setw -g automatic-rename off

# Listen to alerts from all windows
set -g bell-action any

# Mouse madness!
set -g mouse on

# Scroll history
set -g history-limit 30000

# Capture on start and restore on exit when running an application
setw -g alternate-screen on

# Don't wait after Escape, so scroll-buffer access and vim feel instant
set -s escape-time 1

# A server outlives its session, so refresh this for wl-copy when attaching
set -ga update-environment WAYLAND_DISPLAY

# Use vim keybindings in copy mode, and copy to the Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# Paste from the Wayland clipboard
bind ] run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"

# Run a quick command without creating a new window
bind k command-prompt -p cmd: "run-shell \"%1\""

# Convert a timestamp to a date and copy the date to the clipboard
bind j command-prompt -p timestamp: "run-shell \"date -u -d @%1 | wl-copy\""

# Toggle pane synchronization
bind y setw synchronize-panes

# Paste a snippet for pulling out the second column
set-buffer -b column2 "| awk '{print \$2}'|sort|uniq"
bind h paste-buffer -b column2
