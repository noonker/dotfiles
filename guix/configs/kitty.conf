# ── Font ─────────────────────────────────────────────────────────────────────
font_family      Comic Code
bold_font        Comic Code Bold
italic_font      Comic Code Italic
bold_italic_font Comic Code Bold Italic
font_size        12.0

# Nerd Font symbol fallback via JetBrains Mono (covers icons used in waybar/tmux)
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 JetBrains Mono

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0

# ── Scrollback ───────────────────────────────────────────────────────────────
# Match tmux history-limit
scrollback_lines 30000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ────────────────────────────────────────────────────────────────────
mouse_hide_wait       3.0
copy_on_select        clipboard
strip_trailing_spaces smart
focus_follows_mouse   yes

# ── URLs ─────────────────────────────────────────────────────────────────────
url_style    curly
detect_urls  yes
open_url_with default

# ── Bell ─────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes

# ── Window ───────────────────────────────────────────────────────────────────
remember_window_size    yes
# Match sway's inner gap
window_padding_width    6
hide_window_decorations no

# ── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
# Only show bar when there are multiple tabs (pairs well with tmux)
tab_bar_min_tabs        2
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Colors ───────────────────────────────────────────────────────────────────
# Generated from the day/night palettes in channels/noonker/home/theme.scm
include ~/.local/state/theme/current/kitty.conf

# ── Keybindings ──────────────────────────────────────────────────────────────
# Vim-style window navigation (mirrors sway's mod+hjkl)
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Splits that open in the current working directory
map ctrl+shift+\     launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current

# New tab in current directory
map ctrl+shift+t new_tab_with_cwd

# Jump to tab by number (alt+N avoids conflict with sway's mod+N workspace switching)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# ── Shell integration ────────────────────────────────────────────────────────
# Enables prompt tracking, cwd in tab title, marks at each prompt, etc.
shell_integration enabled

# ── Clipboard (Wayland) ──────────────────────────────────────────────────────
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Remote control ───────────────────────────────────────────────────────────
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# ── Wayland ──────────────────────────────────────────────────────────────────
linux_display_server wayland
